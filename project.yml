name: SEQTADisengage
options:
  bundleIdPrefix: au.schoolkid
  deploymentTarget:
    iOS: '17.0'
packages:
  SchoolKits:
    path: .
targets:
  SEQTADisengage:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: SchoolKits
        product: LMSKit
      - package: SchoolKits
        product: CanteenKit
      - target: SchoolkidWidgets
    entitlements:
      path: Config/SEQTADisengage.entitlements
      properties:
        com.apple.security.application-groups: [group.au.schoolkid.engage]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.schoolkid.engage
        PRODUCT_NAME: SEQTADisengage
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Schoolkid Engage
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: '1.0.1'
        CURRENT_PROJECT_VERSION: '21'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CYQ6X8DT95
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  SchoolkidWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: SchoolKits
        product: LMSKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Config/SchoolkidWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.au.schoolkid.engage]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.schoolkid.engage.widgets
        PRODUCT_NAME: SchoolkidWidgets
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Schoolkid Engage
        MARKETING_VERSION: '1.0.1'
        CURRENT_PROJECT_VERSION: '21'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CYQ6X8DT95
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
  ReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: SEQTADisengage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  SEQTADisengage:
    build:
      targets:
        SEQTADisengage: all
    test:
      targets: [ReaderUITests]
    run:
      config: Debug
